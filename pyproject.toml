[project]
name = "pivot"
version = "0.1.0"
description = "Pivot"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-vector-stores-milvus>=0.6.0",
    "markdown>=3.7",
    "minio>=7.2.0",
    "pymilvus>=2.5.0",
    "sentence-transformers>=3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.12.1",
    "pymysql>=1.1.3",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "openai>=2.37.0",
    "mcp[cli]>=1.27.1",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

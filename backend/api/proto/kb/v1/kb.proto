syntax = "proto3";

package pivot.kb.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mymikasa/pivot/api/gen/kb/v1;kbv1";

// KnowledgeBaseService manages knowledge bases and documents.
service KnowledgeBaseService {
  // Knowledge base CRUD
  rpc CreateKnowledgeBase(CreateKnowledgeBaseRequest) returns (CreateKnowledgeBaseResponse) {
    option (google.api.http) = {
      post: "/api/v1/kb"
      body: "*"
    };
  }
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse) {
    option (google.api.http) = { get: "/api/v1/kb" };
  }
  rpc GetKnowledgeBase(GetKnowledgeBaseRequest) returns (GetKnowledgeBaseResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{id}" };
  }
  rpc UpdateKnowledgeBase(UpdateKnowledgeBaseRequest) returns (UpdateKnowledgeBaseResponse) {
    option (google.api.http) = {
      post: "/api/v1/kb/{id}/update"
      body: "*"
    };
  }
  rpc DeleteKnowledgeBase(DeleteKnowledgeBaseRequest) returns (DeleteKnowledgeBaseResponse) {
    option (google.api.http) = { post: "/api/v1/kb/{id}/delete" };
  }

  // Document management (streaming — gRPC only, no HTTP gateway)
  rpc UploadDocument(stream UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc DownloadDocument(DownloadDocumentRequest) returns (stream DownloadDocumentResponse);

  // Document management (unary — exposed via HTTP gateway)
  rpc UploadDocumentSimple(UploadDocumentSimpleRequest) returns (UploadDocumentResponse) {
    option (google.api.http) = {
      post: "/api/v1/kb/{kb_id}/documents/upload"
      body: "*"
    };
  }
  rpc DownloadDocumentSimple(DownloadDocumentRequest) returns (DownloadDocumentSimpleResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{kb_id}/documents/{doc_id}/download" };
  }

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{kb_id}/documents" };
  }
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (google.api.http) = { post: "/api/v1/kb/{kb_id}/documents/{doc_id}/delete" };
  }

  // Presigned URL upload/download
  rpc PrepareDocumentUpload(PrepareDocumentUploadRequest) returns (PrepareDocumentUploadResponse) {
    option (google.api.http) = {
      post: "/api/v1/kb/{kb_id}/documents/prepare-upload"
      body: "*"
    };
  }
  rpc ConfirmDocumentUpload(ConfirmDocumentUploadRequest) returns (ConfirmDocumentUploadResponse) {
    option (google.api.http) = {
      post: "/api/v1/kb/{kb_id}/documents/confirm-upload"
      body: "*"
    };
  }
  rpc GetDocumentDownloadURL(GetDocumentDownloadURLRequest) returns (GetDocumentDownloadURLResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{kb_id}/documents/{doc_id}/download-url" };
  }

  // Chunk & parse status
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{kb_id}/documents/{doc_id}/chunks" };
  }
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse) {
    option (google.api.http) = { post: "/api/v1/kb/{kb_id}/documents/{doc_id}/chunks/{chunk_index}/delete" };
  }
  rpc GetParseStatus(GetParseStatusRequest) returns (GetParseStatusResponse) {
    option (google.api.http) = { get: "/api/v1/kb/{kb_id}/documents/{doc_id}/parse-status" };
  }
}

// --- Knowledge base messages ---

message KnowledgeBase {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 owner_id = 4;
  int32 document_count = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateKnowledgeBaseRequest {
  string name = 1;
  string description = 2;
}

message CreateKnowledgeBaseResponse {
  KnowledgeBase kb = 1;
}

message ListKnowledgeBasesRequest {}

message ListKnowledgeBasesResponse {
  repeated KnowledgeBase items = 1;
}

message GetKnowledgeBaseRequest {
  int64 id = 1;
}

message GetKnowledgeBaseResponse {
  KnowledgeBase kb = 1;
}

message UpdateKnowledgeBaseRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
}

message UpdateKnowledgeBaseResponse {
  KnowledgeBase kb = 1;
}

message DeleteKnowledgeBaseRequest {
  int64 id = 1;
}

message DeleteKnowledgeBaseResponse {}

// --- Document messages ---

message Document {
  int64 id = 1;
  int64 kb_id = 2;
  string filename = 3;
  string content_type = 4;
  int32 file_size = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  string parse_status = 8;
  int64 parse_task_id = 9;
  int32 parse_progress = 10;
  string parse_error = 11;
  google.protobuf.Timestamp parsed_at = 12;
  string object_key = 13;
}

message UploadDocumentRequest {
  int64 kb_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes data = 4;
}

message UploadDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  int64 kb_id = 1;
}

message ListDocumentsResponse {
  repeated Document items = 1;
}

message DeleteDocumentRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
}

message DeleteDocumentResponse {}

message DownloadDocumentRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
}

message DownloadDocumentResponse {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message UploadDocumentSimpleRequest {
  int64 kb_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes data = 4;
}

message DownloadDocumentSimpleResponse {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

// --- Presigned URL messages ---

message PrepareDocumentUploadRequest {
  int64 kb_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 file_size = 4;
}

message PrepareDocumentUploadResponse {
  string object_key = 1;
  string upload_url = 2;
}

message ConfirmDocumentUploadRequest {
  int64 kb_id = 1;
  string object_key = 2;
  string filename = 3;
  string content_type = 4;
  int64 file_size = 5;
}

message ConfirmDocumentUploadResponse {
  Document document = 1;
}

message GetDocumentDownloadURLRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
}

message GetDocumentDownloadURLResponse {
  string download_url = 1;
  string filename = 2;
  string content_type = 3;
}

// --- Chunk messages ---

message Chunk {
  int64 id = 1;
  int64 kb_id = 2;
  int64 document_id = 3;
  int32 chunk_index = 4;
  string content = 5;
  int32 token_count = 6;
  int32 source_page = 7;
  string section_title = 8;
  string section_path = 9;
  string filename = 10;
  string content_type = 11;
  int32 chunk_size = 12;
  int32 chunk_overlap = 13;
  int32 version = 14;
  int64 user_id = 15;
  int64 milvus_id = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message ListChunksRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
}

message ListChunksResponse {
  repeated Chunk items = 1;
}

message DeleteChunkRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
  int32 chunk_index = 3;
}

message DeleteChunkResponse {}

message GetParseStatusRequest {
  int64 kb_id = 1;
  int64 doc_id = 2;
}

message GetParseStatusResponse {
  string status = 1;
  int32 progress = 2;
  string error = 3;
  google.protobuf.Timestamp parsed_at = 4;
}

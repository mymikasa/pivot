services:
  mysql:
    image: mysql:8.0.39
    container_name: pivot-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pivot_root_2026
      MYSQL_DATABASE: pivot
      MYSQL_USER: pivot
      MYSQL_PASSWORD: pivot_pass_2026
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: pivot-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  minio_data:

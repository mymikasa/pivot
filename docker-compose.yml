services:
  mysql:
    image: mysql:8.0.39
    container_name: pivot-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pivot_root_2026
      MYSQL_DATABASE: pivot
      MYSQL_USER: pivot
      MYSQL_PASSWORD: pivot_pass_2026
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: pivot-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pivot-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: pivot-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "19091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: pivot-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: milvus
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd

  attu:
    image: zilliz/attu:v2.4
    container_name: pivot-attu
    ports:
      - "19080:3000"
    environment:
      MILVUS_URL: pivot-milvus:19530
    depends_on:
      - milvus

volumes:
  mysql_data:
  minio_data:
  etcd_data:
  milvus_data:
